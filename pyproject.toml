[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nutrition-ai-assistant"
version = "0.1.0"
description = "RAG and tool-calling nutrition assistant for gym enthusiasts (Streamlit, LangChain, OpenRouter, Chroma)"
readme = "README.md"
requires-python = ">=3.14"
# Pinned versions and licences are listed in docs/ARCHITECTURE.md section 12.
dependencies = [
    "chromadb==1.5.9",
    "langchain==1.4.6",
    "langchain-chroma==1.1.0",
    "langchain-openai==1.7.2",
    "langchain-text-splitters==1.1.3",
    "pydantic==2.14.1",
    "rank-bm25==0.2.2",
    "rapidfuzz==3.14.6",
    "reportlab==5.0.1",
    "streamlit==1.66.0",
]

[project.optional-dependencies]
# Pinned too, so a new ruff or pytest release cannot turn CI red on an unrelated PR;
# Dependabot proposes upgrades.
dev = [
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
