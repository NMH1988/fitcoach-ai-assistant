[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fitcoach-ai-assistant"
version = "0.1.0"
description = "RAG and tool-calling nutrition assistant for gym enthusiasts (Streamlit, LangChain, OpenRouter, Chroma)"
readme = "README.md"
requires-python = ">=3.14"
# Pinned versions and licences are listed in docs/ARCHITECTURE.md section 12.
dependencies = [
    "chromadb==1.5.9",
    "langchain==1.4.6",
    "langchain-chroma==1.1.0",
    "langchain-openai==1.7.2",
    "langchain-text-splitters==1.1.3",
    # The chat turn's StateGraph (T9.2); langgraph-prebuilt holds the ToolNode we import.
    "langgraph==1.2.17",
    # The InMemorySaver of the chat's short-term memory (T9.4).
    "langgraph-checkpoint==4.3.0",
    # The weekly review's SqliteSaver (T9.16, D12): a review waiting for the coach survives a
    # restart. MIT; it pulls in aiosqlite (MIT) and sqlite-vec (MIT or Apache-2.0), checked by
    # tests/test_dependency_licences.py.
    "langgraph-checkpoint-sqlite==3.1.2",
    "langgraph-prebuilt==1.1.1",
    # Masked LangSmith tracing (T9.8): already pulled in by langchain-core, pinned on its own so
    # its version moves only through a reviewed bump. MIT (the LICENSE in
    # github.com/langchain-ai/langsmith-sdk and the wheel's metadata, checked 2026-11-06).
    "langsmith==0.14.12",
    # Used directly by src/llm.py (its error classes); its retry policy is what the tests pin.
    "openai==3.35.1",
    "pydantic==2.14.1",
    "rank-bm25==0.2.2",
    "rapidfuzz==3.14.6",
    # Not used by our code: it comes with streamlit and reportlab. Pinned like the rest, so an
    # existing venv upgrades too and the pillow 12.3.0 advisories stay out (T1.6a;
    # docs/SECURITY.md); Dependabot proposes bumps.
    "pillow==13.0.0",
    "reportlab==5.1.0",
    # The auth extra brings Authlib (and httpx), which st.login needs for sign-in with Google (T9.5).
    "streamlit[auth]==1.66.1",
    # Pinned on its own too, so its version moves only through a reviewed bump (T9.5).
    "authlib==1.9.2",
]

[project.optional-dependencies]
# Pinned too, so a new ruff or pytest release cannot turn CI red on an unrelated PR;
# Dependabot proposes upgrades.
dev = [
    # The OpenAI SDK's HTTP library; the tests use its MockTransport.
    "httpx2==2.14.0",
    "pip-audit==2.10.1",
    # Reads the session summary PDF's text back in the tests (T5.2).
    "pypdf==6.21.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]
# The evaluation scores of T9.10: run only by the owner's scripts/run_evaluation.py --score and
# its tests, never by the app. Apache-2.0; what it pulls in is checked with the runtime
# dependencies by tests/test_dependency_licences.py. Ragas could not be used: its `instructor`
# needs jiter<0.15, the openai pin jiter>=0.16 (T9.10's Research phase).
# CI's `pip-audit .` does not read this extra: a PR that changes this pin, Dependabot's included,
# gets a hand `pip-audit --local --skip-editable` in a venv with `.[dev,eval]`, with CI's chromadb
# ignores, and the result in the PR (owner's choice, 2026-11-07; docs/SECURITY.md).
eval = [
    "deepeval==4.3.3",
]
# The README images of T9.27: scripts/capture_media.py drives a local browser with Playwright,
# only on the owner's machine, never in the app or in CI. Apache-2.0; it pulls in greenlet
# (MIT AND PSF-2.0) and pyee (MIT). The browser is an open-source Chromium snapshot downloaded by
# hand, never `playwright install`, whose builds are excluded (docs/SOURCES.md, "Tools used to
# make media"). tests/test_dependency_licences.py does not walk this extra (a local tool, recorded
# by hand); a PR that changes this pin gets a hand `pip-audit` like the eval extra's.
media = [
    "playwright==1.64.1",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# deepeval (the eval extra, T9.10) installs pytest plugins that load themselves into every run:
# its own (which imports deepeval, and with it a reader of .env files and telemetry) and four it
# pulls in. None is used here, so the suite runs as it did before them.
addopts = [
    "-p", "no:deepeval",
    "-p", "no:xdist",
    "-p", "no:xdist.looponfail",
    "-p", "no:rerunfailures",
    "-p", "no:repeat",
    "-p", "no:asyncio",
]
# deepeval's own code warns hundreds of times on Python 3.14 (asyncio.iscoroutinefunction). Its
# `return` in a `finally` block warns when the file is compiled, which no module filter catches,
# so that one is matched by its text; ruff's B012 keeps the pattern out of our own code.
filterwarnings = [
    "ignore::DeprecationWarning:deepeval",
    "ignore:'return' in a 'finally' block:SyntaxWarning",
]
markers = ["turn_error: the test expects a turn to end in the catch-all's turn.error (T1.8)"]
