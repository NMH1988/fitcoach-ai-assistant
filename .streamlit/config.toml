# Streamlit settings: the theme from docs/UI_DESIGN.md (T3.1), light and dark mode (T7.3), and
# the server, telemetry and error settings (T1.7).

[server]
# This machine only: without it Streamlit listens on every interface, so anyone on the same
# network could open the app and spend the key. A public deployment may change it only together
# with one of the options in docs/DEPLOYMENT.md (T1.7).
address = "localhost"

[browser]
# No usage events, so page views do not send visitors' IPs to Streamlit's metrics host (T1.7).
gatherUsageStats = false

[client]
# Users switch System, Light or Dark at the top of Streamlit's menu (top right) (T7.3). "auto"
# keeps that switch for every visitor and shows the developer options only on localhost;
# "minimal" would hide it.
toolbarMode = "auto"
# An uncaught error shows a generic message, never its text, type or traceback (T1.7).
showErrorDetails = "none"

[theme]
# System font: no Google Fonts request, so visitors' IPs are not sent to Google.
font = "sans-serif"
# 17 px: the default 16 and the earlier 14 read too small in the chat (owner, 2026-10-20).
baseFontSize = 17
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
# The default 2.25rem cuts off the profile values in the sidebar tiles (T4.1).
metricValueFontSize = "1.25rem"
linkUnderline = false

[theme.light]
# Teal-green, dark enough for white button text (WCAG AA).
primaryColor = "#0F6E56"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F5"
# Dark enough that captions (drawn at 60% opacity) meet WCAG AA on both backgrounds (T7.3).
textColor = "#14171B"
borderColor = "#D8DEDB"
greenColor = "#0F6E56"
orangeColor = "#BA7517"
violetColor = "#534AB7"

[theme.dark]
# White button text on this green is 3.4:1, under AA; a darker green would make the accent text
# on the dark background fall under AA instead (owner kept it, T7.3; docs/TESTING.md).
primaryColor = "#1D9E75"
backgroundColor = "#0F1412"
secondaryBackgroundColor = "#18201D"
textColor = "#E6EDEA"
borderColor = "#2C3633"
greenColor = "#5DCAA5"
orangeColor = "#EF9F27"
violetColor = "#AFA9EC"

# The brand sidebar (T9.23, owner's decision, 2026-10-30): deep green with light text in both modes,
# values from the T9.15 mockups. Text, captions (60% opacity) and the primary colour as text (a
# selected option) meet WCAG AA on both sidebar backgrounds (tests/test_theme.py). White text on
# this primary is 2.0:1, so no primary button goes in the sidebar without a new colour check. The
# blue badges (the last answer's filters) get a lighter text colour on their blue fill, as
# Streamlit's own is 3.2:1 there; their fill is blueColor at 20% (measured in the browser).
[theme.light.sidebar]
primaryColor = "#5DCAA5"
backgroundColor = "#0D3B2F"
secondaryBackgroundColor = "#124538"
textColor = "#EEF6F3"
borderColor = "#2F5E50"
blueColor = "#3D9DF3"
blueTextColor = "#9CCBF7"

[theme.dark.sidebar]
primaryColor = "#5DCAA5"
backgroundColor = "#0A2219"
secondaryBackgroundColor = "#11322A"
textColor = "#EEF6F3"
borderColor = "#2A4A40"
blueColor = "#3D9DF3"
blueTextColor = "#9CCBF7"
